# 合并到现有 ai.muyaju.net 的 HTTPS server 内，不能单独作为顶层conf加载。
# 先启动并验收api；Docker DNS会在nginx reload时解析此唯一网络别名。
location = /data-service {
    return 308 /data-service/;
}

location ^~ /data-service/ {
    # 尾斜杠去掉外部前缀，应用的DS_ROOT_PATH负责生成对外地址。
    proxy_pass http://muyaju-data-reservoir-api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 覆盖客户端传入的同名头，禁止透传伪造的代理链。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Connection "";
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
}
