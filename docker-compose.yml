name: muyaju-data-service
x-app: &app
  image: muyaju-data-service:1.6.0
  build: .
  env_file: .env
  environment:
    DS_DATABASE_URL: ${DS_DOCKER_DATABASE_URL:?请先初始化配置}
    DS_SOURCE_CONFIG_PATH: /app/config/sources.json
    DS_DATASET_CONFIG_PATH: /app/config/datasets.json
    TZ: Asia/Shanghai
  volumes:
    - ./config:/app/config:ro
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: Asia/Shanghai
    volumes:
      - data-service-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DS_DB_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  init:
    <<: *app
    command: ["python", "-m", "data_service.cli", "init"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "${DS_BIND_ADDRESS:-127.0.0.1}:${DS_API_PORT:-8090}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: ["python", "-m", "data_service.worker"]
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  data-service-db:
